name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { python: ["3.11", "3.12"] } }
    env:
      DATABASE_URL: postgresql+psycopg://risk:risk@localhost:5432/risk   # makes tests/test_postgres.py run (it skips without this)
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: risk, POSTGRES_PASSWORD: risk, POSTGRES_DB: risk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U risk" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit + integration tests (SQLite fixtures, PostgreSQL test enabled)
        run: pytest -q -rs
      - name: PostgreSQL test must RUN, not skip
        run: |
          pytest tests/test_postgres.py -q -rs | tee pg.out
          grep -q "1 passed" pg.out && ! grep -qi "skipped" pg.out
      - name: Full-scale reproducibility (reported metrics within tolerance)
        if: matrix.python == '3.12'
        env: { RISK_FULL_REPRO: "1" }
        run: pytest -q tests/test_reproducibility.py

  windows:
    runs-on: windows-latest
    env: { PYTHONUTF8: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      - name: Tests on Windows (SQLite; PostgreSQL test is skipped here and runs in the Linux job)
        run: pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    env: { RISK_API_KEY: ci-demo-key }
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (db -> pipeline job -> api + dashboard)
        run: docker compose up -d --build
      - name: Wait for the pipeline job and API
        run: |
          for i in $(seq 1 90); do curl -fs localhost:8000/health && break; sleep 5; done
          curl -fs localhost:8000/health
      - name: API auth enforced and scoring works
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/model)" = 401
          curl -fs -H "X-API-Key: ci-demo-key" localhost:8000/score/T0300000 | grep -q risk_score
          curl -fs localhost:8501/_stcore/health
      - if: failure()
        run: docker compose logs --tail=100
      - run: docker compose down -v
