name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.11", "3.12"] } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: risk, POSTGRES_PASSWORD: risk, POSTGRES_DB: risk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U risk" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q                       # unit + integration tests on SQLite
      - name: SQL library on PostgreSQL (small dataset)
        env: { DATABASE_URL: "postgresql+psycopg://risk:risk@localhost:5432/risk" }
        run: python -m pytest -q tests/test_postgres.py
      - name: Reproducible pipeline smoke run
        run: python -m riskplatform.pipeline all --customers 600
