# docker compose up --build      -> Postgres, one-shot pipeline (generate -> load -> SQL analytics -> train -> monitor), API, dashboard
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://risk:risk@db:5432/risk
    RISK_API_KEY: ${RISK_API_KEY:-change-me-demo-key}   # override: RISK_API_KEY=... docker compose up
  volumes:
    - artifacts:/app/artifacts

services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: risk, POSTGRES_PASSWORD: risk, POSTGRES_DB: risk }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk"]
      interval: 3s
      retries: 20

  pipeline:
    <<: *app
    command: python -m riskplatform.pipeline all
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on: { pipeline: { condition: service_completed_successfully } }

  dashboard:
    <<: *app
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports: ["127.0.0.1:${DASH_PORT:-8501}:8501"]
    depends_on: { pipeline: { condition: service_completed_successfully } }

volumes:
  pgdata:
  artifacts:
