[project]
name = "riskplatform"
version = "1.0.0"
description = "Financial Transaction Risk Intelligence Platform (synthetic-data reference implementation)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702", "E701", "E731", "E741", "E401"]
